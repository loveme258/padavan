name: toolchain

on: 
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [mipsel-linux-uclibc, mipsel-linux-musl]
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare
        run: |
          sudo apt update
          sudo apt install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin
            
      - name: Build
        run: |
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}.tar.xz *
        env:
          CT_TARGET: ${{ matrix.target }}
          CT_VERSION: 1.26.0
        working-directory: toolchain
        
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.target }} # v4 要求名称唯一，防止矩阵任务冲突
          path: toolchain/${{ matrix.target }}.tar.xz
          
      - uses: svenstaro/upload-release-action@2.9.0 # 升级到较新版本
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: toolchain/${{ matrix.target }}.tar.xz
          tag: toolchain
          overwrite: true